{% extends "base.html" %}

{% block content %}
<h2>Nova Demanda</h2>

<div class="card">
<form method="POST" action="/nova_demanda">
    <div class="form-group">
        <label>Título:</label>
        <input type="text" name="titulo" value="{{ titulo or '' }}" required>
    </div>

    <div class="form-group">
        <label>Descrição:</label>
        <textarea name="descricao" rows="5" required>{{ descricao or '' }}</textarea>
    </div>

    <div class="form-group">
        <label>Solicitante:</label>
        <select name="solicitante_id" required>
            <option value="" disabled {% if not solicitante_id %}selected{% endif %}>Selecione um usuário</option>
            {% for usuario in usuarios %}
            <option value="{{ usuario['id'] }}" {% if solicitante_id and solicitante_id|string == usuario['id']|string %}selected{% endif %}>{{ usuario['nome'] }}</option>
            {% endfor %}
        </select>
        <small><a href="/usuarios">Cadastrar novo usuário</a></small>
    </div>

    <div class="form-group">
        <label>Responsável:</label>
        <select name="responsavel_id" required>
            <option value="" disabled {% if not responsavel_id %}selected{% endif %}>Selecione um usuário</option>
            {% for usuario in usuarios %}
            <option value="{{ usuario['id'] }}" {% if responsavel_id and responsavel_id|string == usuario['id']|string %}selected{% endif %}>{{ usuario['nome'] }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Prioridade:</label>
        <select name="prioridade">
            {% for p in prioridades %}
            <option value="{{ p }}" {% if p == (prioridade_selecionada or 'Média') %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Status:</label>
        <select name="status">
            {% for s in status_opcoes %}
            <option value="{{ s }}" {% if s == (status_selecionado or 'Aberta') %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="acoes-rodape">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
</div>

{% endblock %}
