{% extends "base.html" %}

{% block content %}
<h2>Editar Demanda</h2>

<div class="card">
<form method="POST" action="/editar/{{ demanda['id'] }}">
    <div class="form-group">
        <label>Título:</label>
        <input type="text" name="titulo" value="{{ demanda['titulo'] }}" required>
    </div>

    <div class="form-group">
        <label>Descrição:</label>
        <textarea name="descricao" rows="5" required>{{ demanda['descricao'] }}</textarea>
    </div>

    <div class="form-group">
        <label>Solicitante:</label>
        <select name="solicitante_id" required>
            {% for usuario in usuarios %}
            <option value="{{ usuario['id'] }}" {% if usuario['id'] == demanda['solicitante_id'] %}selected{% endif %}>{{ usuario['nome'] }}</option>
            {% endfor %}
        </select>
        <small><a href="/usuarios">Cadastrar novo usuário</a></small>
    </div>

    <div class="form-group">
        <label>Responsável:</label>
        <select name="responsavel_id" required>
            {% for usuario in usuarios %}
            <option value="{{ usuario['id'] }}" {% if usuario['id'] == demanda['responsavel_id'] %}selected{% endif %}>{{ usuario['nome'] }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Data de Criação:</label>
        <input type="text" value="{{ demanda['data_criacao']|data_hora_br }}" disabled>
    </div>

    <div class="form-group">
        <label>Prioridade:</label>
        <select name="prioridade">
            {% for p in prioridades %}
            <option value="{{ p }}" {% if p == demanda['prioridade'] %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Status:</label>
        <select name="status">
            {% for s in status_opcoes %}
            <option value="{{ s }}" {% if s == demanda['status'] %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="acoes-rodape">
        <button type="submit" class="btn btn-primary">Atualizar</button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
</div>

{% endblock %}
