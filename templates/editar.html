{% extends "base.html" %}

{% block content %}
<h2>Editar Demanda</h2>


<form method="POST" action="/editar/{{ demanda[0] }}">
    <div>
        <label>Título:</label><br>
        <input type="text" name="titulo" value="{{ demanda[1] }}" size="50" required>
    </div>
    <br>
    
    <div>
        <label>Descrição:</label><br>
        <textarea name="descricao" rows="5" cols="50" required>{{ demanda[2] }}</textarea>
    </div>
    <br>
    
    <div>
        <label>Solicitante:</label><br>
        <input type="text" name="solicitante" value="{{ demanda[3] }}" required>
    </div>
    <br>
    
    <div>
        <label>Data de Criação:</label><br>
        <input type="text" value="{{ demanda[4] }}" disabled>
    </div>
    <br>

    <div>
        <label>Prioridade:</label><br>
        <select name="prioridade">
            {% for p in prioridades %}
            <option value="{{ p }}" {% if p == demanda[5] %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    
    <button type="submit">Atualizar</button>
    <a href="/"><button type="button">Cancelar</button></a>
</form>

{% endblock %}
